<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ block "title" . }}{{ with .Title }}{{ . }} — {{ end }}{{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="author" content="{{ site.Params.author }}">
  {{ partial "opengraph.html" . }}
  {{ partial "schema.html" . }}
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
  {{ with .OutputFormats.Get "rss" }}
    <link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ .Permalink }}">
  {{ end }}
  <script>
    (function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)})();
  </script>
</head>
<body>

  <header class="site-header">
    <div class="site-title">
      <div class="site-brand"><a href="{{ "/" | relURL }}">nisar<span class="title-accent">Syed</span></a></div>
      <button class="theme-toggle" aria-label="Switch to light theme" title="Switch to light theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
    <nav class="site-nav">
      <a href="{{ "/blog/" | relURL }}">blog</a>
      <a href="{{ "/projects/" | relURL }}">projects</a>
      <a href="{{ "/about/" | relURL }}">about</a>
      <a href="{{ "/index.xml" | relURL }}">rss</a>
    </nav>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <span>&copy; {{ now.Format "2006" }} Nisar</span>
    <div class="footer-social">
      <a href="{{ site.Params.social.github }}" target="_blank" rel="me noopener" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12 24 5.37 18.63 0 12 0z"/>
        </svg>
      </a>

    </div>
  </footer>

  <script>
    (function(){
      var btn=document.querySelector('.theme-toggle');
      var html=document.documentElement;
      function update(){
        var light=html.getAttribute('data-theme')==='light';
        var label=light?'Switch to dark theme':'Switch to light theme';
        btn.setAttribute('aria-label',label);
        btn.setAttribute('title',label);
      }
      update();
      btn.addEventListener('click',function(){
        var next=html.getAttribute('data-theme')==='light'?null:'light';
        if(next){html.setAttribute('data-theme',next);localStorage.setItem('theme',next)}
        else{html.removeAttribute('data-theme');localStorage.removeItem('theme')}
        update();
      });
    })();
  </script>

  <script>
    (function(){
      document.querySelectorAll('.highlight').forEach(function(block){
        var btn=document.createElement('button');
        btn.className='copy-btn';
        btn.textContent='Copy';
        btn.setAttribute('aria-label','Copy code to clipboard');
        btn.addEventListener('click',function(){
          var code=block.querySelector('code');
          if(!code)return;
          navigator.clipboard.writeText(code.textContent).then(function(){
            btn.textContent='Copied!';
            btn.setAttribute('data-copied','true');
            btn.setAttribute('aria-label','Copied');
            setTimeout(function(){
              btn.textContent='Copy';
              btn.removeAttribute('data-copied');
              btn.setAttribute('aria-label','Copy code to clipboard');
            },1500);
          });
        });
        block.appendChild(btn);
      });
    })();
  </script>

  <script>
    (function(){
      var toc=document.querySelector('.toc #TableOfContents');
      if(!toc)return;
      var links=toc.querySelectorAll('a');
      var headings=[];
      links.forEach(function(a){
        var id=a.getAttribute('href');
        if(id&&id.startsWith('#')){
          var el=document.getElementById(id.slice(1));
          if(el)headings.push({el:el,link:a});
        }
      });
      if(!headings.length)return;
      var ticking=false;
      function update(){
        var current=null;
        for(var i=0;i<headings.length;i++){
          if(headings[i].el.getBoundingClientRect().top<=80)current=i;
        }
        links.forEach(function(a){a.classList.remove('toc-active')});
        if(current!==null)headings[current].link.classList.add('toc-active');
        ticking=false;
      }
      window.addEventListener('scroll',function(){
        if(!ticking){requestAnimationFrame(update);ticking=true;}
      });
      update();
    })();
  </script>
</body>
</html>
