baseURL = 'https://nisarsy.com/'
languageCode = 'en-us'
title = 'nisarSyed'
timeZone = 'Asia/Karachi'
enableRobotsTXT = true

[params]
  description = 'Software engineer. Writing about systems, AI, and life.'
  author = 'Nisar Syed'
  jobTitle = 'Software engineer'

  [params.social]
    github = 'https://github.com/nisarsyed'
    linkedin = 'https://www.linkedin.com/in/nisarsy'
    x = 'https://x.com/nisar_sy'

[markup]
  [markup.highlight]
    lineNos = false
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[taxonomies]
  tag = "tags"
  series = "series"

[pagination]
  pagerSize = 20

[outputs]
  home = ['html', 'rss']

[sitemap]
  changeFreq = 'weekly'
  priority = 0.5
